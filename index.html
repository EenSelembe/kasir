<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Online</title>
</head>

<body style="font-family:Arial; padding:20px">

<h2>📦 Input Barang</h2>

<input id="nama" placeholder="Nama barang"><br><br>
<input id="barcode" placeholder="Barcode (boleh kosong)"><br><br>
<input id="harga" placeholder="Harga"><br><br>

<button onclick="tambah()">Simpan</button>

<hr>

<h2>🔍 Cari Barang</h2>

<input id="cari" placeholder="Nama / barcode"><br><br>
<button onclick="cari()">Cari</button>

<p id="hasil"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDmdbfP_OyG_PzMlsPUghbH13D5u2o6DhM",
  authDomain: "een-store-atk.firebaseapp.com",
  projectId: "een-store-atk",
  storageBucket: "een-store-atk.firebasestorage.app",
  messagingSenderId: "32934944326",
  appId: "1:32934944326:web:a67d0e55186b990d55f447"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// SIMPAN DATA
window.tambah = async function() {
  const nama = document.getElementById("nama").value;
  const barcode = document.getElementById("barcode").value;
  const harga = document.getElementById("harga").value;

  if (!nama || !harga) {
    alert("Nama & harga wajib!");
    return;
  }

  await addDoc(collection(db, "barang"), {
    nama,
    barcode,
    harga
  });

  alert("Berhasil disimpan!");
}

// CARI DATA
window.cari = async function() {
  const keyword = document.getElementById("cari").value.toLowerCase();

  let hasil = "";

  const querySnapshot = await getDocs(collection(db, "barang"));

  querySnapshot.forEach((doc) => {
    const d = doc.data();

    if (
      d.nama.toLowerCase().includes(keyword) ||
      (d.barcode && d.barcode.includes(keyword))
    ) {
      hasil += `${d.nama} - Rp ${d.harga}<br>`;
    }
  });

  document.getElementById("hasil").innerHTML = hasil || "Tidak ditemukan";
}

</script>

</body>
</html>
